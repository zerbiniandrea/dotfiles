# Wayle resolves the default audio device once at startup and drops the
# "default changed" event if the device isn't in its store yet. Hyprland
# execs wayle ~200ms before pipewire starts, and wireplumber needs another
# ~1.3s to enumerate hardware, so wayle latches onto the auto_null "Dummy
# Output" and the volume keys become no-ops until it's restarted.
#
# Wait for a real sink before starting. Bails out after 5s so a genuinely
# sink-less boot still brings the bar up.
[Unit]
After=wireplumber.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 50); do pactl list short sinks 2>/dev/null | grep -qv auto_null && exit 0; sleep 0.1; done'
