# https://wiki.archlinux.org/title/Tmux#Start_a_non-login_shell
set -g default-command "${SHELL}"
# Terminal settings for proper color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 0

# Extended keys support for apps like Claude Code
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Allow passthrough for apps that need direct terminal access
set -g allow-passthrough on

# Enable clipboard integration (OSC 52)
set -s set-clipboard on

# Enable focus events for autoread in nvim
set -g focus-events on

# Change prefix from C-b to C-a (easier to reach)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix


# Colors: styles + @noctalia_* palette come from Noctalia's tmux template,
# sourced at the end of this file. Formats below reference that palette.

set -g status "on"
set -g status-justify "left"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary},bold] #S #[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low},nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#{@noctalia_surface_container_low},bg=#{@noctalia_surface_container_low},nobold,nounderscore,noitalics]#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low}] #{prefix_highlight} #[fg=#{@noctalia_surface_container_highest},bg=#{@noctalia_surface_container_low},nobold,nounderscore,noitalics]#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_highest}] %d-%m-%Y  %I:%M %p #[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_highest},nobold,nounderscore,noitalics]#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary},bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set -g status-right "#[fg=#{@noctalia_surface_container_low},bg=#{@noctalia_surface_container_low},nobold,nounderscore,noitalics]#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low}] #{prefix_highlight} #[fg=#{@noctalia_surface_container_highest},bg=#{@noctalia_surface_container_low},nobold,nounderscore,noitalics]#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_highest}] %d-%m-%Y  %H:%M #[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_highest},nobold,nounderscore,noitalics]#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary},bold] #h "
}

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#{@noctalia_surface_container_low},bg=#{@noctalia_surface_container_low},nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#{@noctalia_surface_container_low},bg=#{@noctalia_surface_container_low},nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#{@noctalia_surface_container_low},bg=#{@noctalia_surface_container_highest},nobold,nounderscore,noitalics]#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_highest},bold] #I  #W #F #[fg=#{@noctalia_surface_container_highest},bg=#{@noctalia_surface_container_low},nobold,nounderscore,noitalics]"

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=#{@noctalia_on_surface_variant}]#[bg=#{@noctalia_surface_container_low}]#[fg=#{@noctalia_surface_container_low}]#[bg=#{@noctalia_on_surface_variant}]"
set -g @prefix_highlight_output_suffix ""

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Vi mode for copy mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

# Copy on mouse selection release (fixes selection disappearing issue)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# Better word separators for double-click selection
set -g word-separators ' -_@'

# Vim-like pane switching
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Quick window switching
bind -r ^ last-window

# Split panes using | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enable mouse support
set -g mouse on

# Increase history limit
set -g history-limit 50000

# Don't rename windows automatically
set-option -g allow-rename off
source-file -q "$HOME/.config/tmux/themes/noctalia.conf"
